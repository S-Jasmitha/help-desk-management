apiVersion: apps/v1
kind: Deployment
metadata:
  name: help-desk-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: help-desk-v3
  template:
    metadata:
      labels:
        app: help-desk-v3
    spec:
      containers:
        - name: help-desk
          image: jasmi4/help-desk-management:v3
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: help-desk-v3-service
spec:
  type: NodePort
  selector:
    app: help-desk-v3
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30086
