
apiVersion: apps/v1
kind: Deployment
metadata:
  name: help-desk-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: help-desk-v2
  template:
    metadata:
      labels:
        app: help-desk-v2
    spec:
      containers:
        - name: help-desk
          image: jasmi4/help-desk-management:v2
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: help-desk-v2-service
spec:
  type: NodePort
  selector:
    app: help-desk-v2
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085
