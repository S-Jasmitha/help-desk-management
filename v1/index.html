<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help Desk v1 — Create Ticket</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="logo">🎧</span> Help Desk Management System</div><span class="version">VERSION 1.0</span></header>
<main><div class="hero"><section class="intro"><div class="eyebrow">IT Support Portal</div><h1>Raise an issue.<br>We’re here to help.</h1><p>Create a support ticket with a clear description and priority. Your issue details will be saved in this browser.</p><div style="font-size:80px;text-align:center">💻 🛠️</div></section>
<section class="panel"><h2>＋ Create a Ticket</h2><div id="message" aria-live="polite"></div><form id="ticketForm"><div class="field"><label for="title">Issue title *</label><input id="title" required maxlength="100" placeholder="e.g. Login not working"></div><div class="field"><label for="description">Description *</label><textarea id="description" required maxlength="1000" placeholder="Describe the issue and what happened"></textarea></div><div class="field"><label for="priority">Priority</label><select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div><button class="full" type="submit">➤ Submit Ticket</button></form></section></div></main>
<footer>© 2026 Help Desk Management System · Agile v1</footer><script src="app.js"></script></body></html>
